<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Clock</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="https://imgs.search.brave.com/CtY1EsGgzZrjHLCvCctIl8LSDn0xynB0pR71wNZdrhI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wMTgv/OTI4Lzg5NC9zbWFs/bC9jbG9jay1pY29u/LWluLWZsYXQtZGVz/aWduLXN0eWxlLWFu/YWxvZy10aW1lLXNp/Z25zLWlsbHVzdHJh/dGlvbi1wbmcucG5n">   

</head>
<body class="theme-white font-roboto">

    <div class="controls">
        <select id="theme-selector" onchange="changeTheme()">
            <option class="buttons" value="theme-white">White</option>
            <option class="buttons" value="theme-black">Black</option>
            <option class="buttons" value="theme-yellow">Yellow</option>
            <option class="buttons" value="theme-glass">Glassy</option>
        </select>
        
        <select id="font-selector" onchange="changeFont()">
            <option class="buttons" value="font-roboto">Roboto Mono</option>
            <option class="buttons" value="font-orbitron">Orbitron</option>
            <option class="buttons" value="font-space">Space Mono</option>
        </select>

        <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Go Fullscreen</button>
        <a class="support" href="https://shubhgw.github.io/buymeacoke/" target="_blank" style="font-family: consolas; color: var(--text-color); text-decoration: none;">Support us</a>
    </div>

    <!-- Clock Display -->
    <div class="clock-container">
        <div id="time">00:00:00</div>
        <div class="date-day">
            <span id="day">Day</span> | <span id="date">Date</span>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
